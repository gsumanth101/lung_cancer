<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-blue-500 p-4 text-white">
        <div class="container mx-auto flex justify-between">
            <h1 class="text-xl font-bold">Dashboard</h1>
            <a href="{{ url_for('logout') }}" class="bg-red-500 px-4 py-2 rounded hover:bg-red-600">Logout</a>
        </div>
    </nav>
    <div class="container mx-auto mt-8">
        <h2 class="text-2xl font-bold mb-4">Your Submissions</h2>
        <a href="{{ url_for('index') }}" class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600 inline-block mb-4">Make a Submission</a>
        {% if submissions %}
        <table class="w-full bg-white rounded shadow-md">
            <thead>
                <tr class="bg-gray-200">
                    <th class="py-2 px-4">Image</th>
                    <th class="py-2 px-4">Prediction</th>
                    <th class="py-2 px-4">Date</th>
                </tr>
            </thead>
            <tbody>
                {% for submission in submissions %}
                <tr class="border-b">
                    <td class="py-2 px-4">
                        <img src="{{ submission.image_path }}" alt="Uploaded Image" class="h-16 w-16 object-cover rounded">
                    </td>
                    <td class="py-2 px-4">{{ submission.prediction }}</td>
                    <td class="py-2 px-4">{{ submission.created_at }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <p class="text-gray-600">No submissions found.</p>
        {% endif %}
    </div>
</body>
</html>
